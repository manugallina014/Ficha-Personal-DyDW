<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Personal - Manuel Gallina</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="ficha-header">
        <h1>Ficha Personal</h1>
        <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
            <span class="icon">🌙</span>
        </button>
    </header>

    <main class="container">
        
        <section class="profile-main">
            <div class="photo-container">
                <img src="IMG/foto carnet (5).jpeg" alt="Foto de Manuel Gallina" class="profile-photo">
            </div>
            
            <h2 class="student-name">Manuel Gallina</h2>
        </section>

        <section class="personal-data-grid">
            
            <div class="data-pair">
                <span class="label">Nombre Completo</span>
                <span class="value-box">Manuel Gallina</span>
            </div>
            
            <div class="data-pair">
                <span class="label">Nro de Legajo</span>
                <span class="value-box">1210857</span>
            </div>
            
            <div class="data-pair">
                <span class="label">Materia</span>
                <span class="value-box">Diseño y Desarrollo Web</span>
            </div>
            
            <div class="data-pair">
                <span class="label">Cursso</span>
                <span class="value-box">2025</span> </div>
            
        </section>
        
        <section class="projects">
            
            <div class="card-container">
                
                <div class="project-card">
                    <div class="card-image">
                        <img src="IMG/jesse.jpeg" alt="Fan Page Breaking Bad">
                    </div>
                    <div class="card-content">
                        <h3>Fan page</h3>
                        <div class="project-links-group">
                            <a href="https://manugallina014.github.io/tpPaginaSerie/" target="_blank" class="project-link-badge">Repositorio</a>
                        </div>
                    </div>
                </div>
                
                <div class="project-card">
                    <div class="card-image">
                        <img src="IMG/tecnoG.png" alt="Local Comercial TecnoG">
                    </div>
                    <div class="card-content">
                        <h3>Local comercial</h3>
                        <div class="project-links-group">
                            <a href="https://manugallina014.github.io/TPparcialDise-oWeb/" target="_blank" class="project-link-badge">Repositorio</a>
                            <a href="#" class="project-link-badge">Documentación</a>
                        </div>
                    </div>
                </div>
                
                <div class="project-card">
                    <div class="card-image">
                        <img src="IMG/LILabasto.png" alt="Shopping Lil Abasto">
                    </div>
                    <div class="card-content">
                        <h3>Centro comercial</h3>
                        <div class="project-links-group">
                            <a href="https://fedesorii.github.io/DyDW-TpLilAbasto/" target="_blank" class="project-link-badge">Repositorio</a>
                            <a href="#" class="project-link-badge">Documentación</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Todos los derechos reservados</p>
    </footer>

 <script src="script.js"></script>
</body>
</html>
